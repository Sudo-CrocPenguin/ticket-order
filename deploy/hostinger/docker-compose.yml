services:
  api:
    build:
      context: ../..
      dockerfile: deploy/hostinger/Dockerfile.api
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ticket_order_data:/app/data
      - ticket_order_uploads:/app/uploads

  web:
    image: nginx:1.27-alpine
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  ticket_order_data:
  ticket_order_uploads:
